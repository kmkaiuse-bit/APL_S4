  <header class="masthead"><div class="mast-inner"><div><p class="eyebrow">2.2 AI與社交媒體 · 第1堂</p><h1>演算法點選中你？</h1></div><span id="save-state" role="status">尚未填答</span></div></header>

  <main id="main" tabindex="-1"><noscript><p>互動作答及保存需要JavaScript；教師仍可直接複製以下完整指令。</p><h3>第1輪：開新對話</h3><pre>幫我寫一段運動鞋宣傳。</pre><h3>第2輪：另開新對話</h3><pre>你是社交媒體文字助手。

產品卡：
虛構山角校園用品店，低筒學生運動鞋，黑／白兩色，每對HK$399。

讀者：香港中學生。
用途：短片畫面上的三句字幕。
溝通目的：讓讀者知道鞋款與售價。

請只寫一版，共三句，分別為開場、商品介紹、結尾。
總共不超過60個中文字，使用直接易懂的繁體中文。

只輸出文字，不生成圖片、聲音或影片。
不新增尺碼、庫存、優惠、送貨、退換或功效。
資料不足就說未提供。
不保證流量、推薦或讀完秒數。</pre><h3>第3輪A：留在第2輪同一對話，選顏色</h3><pre>沿用剛才的產品卡與三句字幕。

只將溝通目的由「讓讀者知道鞋款與售價」，改成「邀請讀者選黑色或白色」。

只調整結尾一句，讓它符合新目的。
開場、商品介紹、語氣、三句格式及60中文字上限維持。

產品事實及售價不能改，不新增任何未提供的承諾。

只輸出修改後三句字幕，不解釋、不保證流量或秒數。</pre><h3>第3輪B：留在第2輪同一對話，問買前資料</h3><pre>沿用剛才的產品卡與三句字幕。

只將溝通目的由「讓讀者知道鞋款與售價」，改成「邀請讀者提出買前需要確認的問題」。

只調整結尾一句，讓它符合新目的。
開場、商品介紹、語氣、三句格式及60中文字上限維持。

產品事實及售價不能改，不新增任何未提供的承諾。

只輸出修改後三句字幕，不解釋、不保證流量或秒數。</pre><h3>第50–51頁：Gemini資料核對完整指令</h3><pre>你是課堂資料核對助手。只按以下提供的資料比較說法，不自行上網，也不聲稱已讀原網站。
待核對說法：平台會先把你的影片推薦給200人，反應好再推薦給1000人。
來源：TikTok公開說明，2020年6月18日。
教師中文摘要（不是逐字引文）：TikTok於2020年6月18日的公開說明描述觀看、互動、影片資訊等多種推薦訊號。這份文章沒有證實每條影片都會先推薦給200人，反應好再推薦給1000人的固定安排；也不能由本文推論所有平台從未做過類似測試。
請只答兩點，每點最多一句，合共不超過100個中文字：
1. 這份資料有沒有支持每條影片都按這個安排推薦？哪些部分未獲支持？
2. 怎樣改成一句沒有講得太盡的說法？
不把「本文未證實」改成「所有平台從未做過」，不新增平台內部資料。</pre><h3>老師視覺示範：寫實攝影</h3><pre>請生成一張虛構運動鞋的社交媒體概念圖片。

主體：一雙黑白配色的低筒運動鞋，沒有品牌標誌。
背景：放學後的室外籃球場，沒有其他人物。
風格：寫實商品攝影，自然光線。
構圖：直式9:16，整雙鞋完整出現在畫面下方三分之二，上方留白，鞋子清晰突出。

不要加入文字、價錢、優惠、商標或浮水印式裝飾。
這是虛構概念圖，不是實際商品照片。</pre><h3>老師視覺示範：3D玩具</h3><pre>請生成一張虛構運動鞋的社交媒體概念圖片。

主體：一雙黑白配色的低筒運動鞋，沒有品牌標誌。
背景：放學後的室外籃球場，沒有其他人物。
風格：3D玩具模型，圓潤造型及啞面塑膠質感。
構圖：直式9:16，整雙鞋完整出現在畫面下方三分之二，上方留白，鞋子清晰突出。

不要加入文字、價錢、優惠、商標或浮水印式裝飾。
這是虛構概念圖，不是實際商品照片。</pre><h3>老師視覺示範：只改背景</h3><pre>請編輯剛才的圖片，只把背景由室外籃球場改成簡潔的學校走廊。

保留同一雙鞋的款式、黑白配色、鞋帶、數量、大小、擺放位置及拍攝角度。
維持寫實攝影、直式9:16和上方留白。
不要增加人物、文字或商標。

只修改背景，其餘盡量保持一致。</pre><h3>老師視覺示範：圖片變短片</h3><pre>以這張圖片為起始畫面，製作約8秒的直式9:16商品展示短片。

同一雙黑白低筒運動鞋固定放在地面，全程保持款式、配色、鞋帶及數量一致。
鏡頭由稍遠的位置緩慢向前推近，最後停在鞋子近景。
背景維持室外籃球場，光線自然穩定。

鞋子不要自行走動、旋轉、變形或變色。
不要增加人物、額外鞋子、文字、商標或旁白。</pre></noscript></main>
